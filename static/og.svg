<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#70374d" opacity="0.10"/>
    </pattern>
    <pattern id="bars" width="17" height="44" patternUnits="userSpaceOnUse">
      <rect width="2" height="44" fill="#ffe2ca"/>
      <rect x="4" width="1" height="44" fill="#ffe2ca"/>
      <rect x="7" width="3" height="44" fill="#ffe2ca"/>
      <rect x="12" width="1" height="44" fill="#ffe2ca"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#ffe2ca"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <rect x="0" y="0" width="1200" height="12" fill="#70374d"/>

  <g transform="translate(72 78)">
    <rect width="188" height="30" fill="#fff1e3" stroke="#70374d" stroke-opacity="0.3"/>
    <circle cx="17" cy="15" r="4" fill="#c06e7b"/>
    <text x="30" y="20" font-family="Menlo, monospace" font-size="12" letter-spacing="3" fill="#70374d">SWIFT BUNDLER</text>
  </g>

  <text x="72" y="252" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="96" font-weight="700" letter-spacing="-5" fill="#70374d">Ship Swift</text>

  <g transform="translate(62 288) rotate(-1.2)">
    <rect x="9" y="9" width="485" height="124" fill="#c06e7b" opacity="0.38"/>
    <rect width="485" height="124" fill="#fff1e3" stroke="#9c4f5f" stroke-width="4"/>
    <text x="26" y="90" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="92" font-weight="700" letter-spacing="-5" fill="#70374d">anywhere.</text>
  </g>

  <text x="72" y="478" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="21" fill="#70374d" opacity="0.78">The only way to build and ship Swift apps for every major platform.</text>
  <text x="72" y="510" font-family="Menlo, monospace" font-size="13" letter-spacing="2" fill="#9c4f5f">macOS · iOS · tvOS · visionOS · Linux · Windows · Android</text>

  <g transform="translate(830 96) rotate(-4)">
    <rect x="8" y="8" width="300" height="380" fill="#c06e7b" opacity="0.45"/>
    <rect width="300" height="380" fill="#fff1e3" stroke="#70374d" stroke-width="3"/>
    <rect x="14" y="14" width="272" height="352" fill="none" stroke="#70374d" stroke-opacity="0.4" stroke-dasharray="5 6"/>
    <text x="30" y="44" font-family="Menlo, monospace" font-size="10" letter-spacing="2" fill="#9c4f5f">moreSwift / logistics</text>
    <text x="30" y="66" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="600" fill="#70374d">Swift Bundler</text>

    <image href="logo.png" x="75" y="82" width="150" height="150"/>

    <text x="30" y="266" font-family="Menlo, monospace" font-size="9" letter-spacing="2" fill="#70374d" opacity="0.5">DESTINATION</text>
    <text x="30" y="284" font-family="Menlo, monospace" font-size="10" fill="#70374d">macOS · iOS · tvOS</text>
    <text x="30" y="302" font-family="Menlo, monospace" font-size="10" fill="#70374d">visionOS · Linux</text>
    <text x="30" y="320" font-family="Menlo, monospace" font-size="10" fill="#70374d">Windows · Android</text>

    <g transform="translate(166 290) rotate(-7)">
      <rect width="86" height="52" fill="#fff1e3" stroke="#9c4f5f" stroke-width="2"/>
      <text x="43" y="15" text-anchor="middle" font-family="Menlo, monospace" font-size="7" letter-spacing="1" fill="#9c4f5f">CLEARED FOR</text>
      <text x="43" y="31" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="700" fill="#9c4f5f">SHIPPING</text>
      <text x="43" y="42" text-anchor="middle" font-family="Menlo, monospace" font-size="7" letter-spacing="1" fill="#9c4f5f">SBUN-3.0.0</text>
    </g>
  </g>

  <rect x="0" y="600" width="1200" height="30" fill="#70374d"/>
  <text x="72" y="620" font-family="Menlo, monospace" font-size="10" letter-spacing="3" fill="#ffe2ca" opacity="0.65">SWIFTBUNDLER.DEV · APACHE 2.0 · MADE IN SWIFT</text>

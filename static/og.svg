<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#70374d" opacity="0.10"/>
    </pattern>
    <pattern id="bars" width="17" height="44" patternUnits="userSpaceOnUse">
      <rect width="2" height="44" fill="#ffe2ca"/>
      <rect x="4" width="1" height="44" fill="#ffe2ca"/>
      <rect x="7" width="3" height="44" fill="#ffe2ca"/>
      <rect x="12" width="1" height="44" fill="#ffe2ca"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#ffe2ca"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <rect x="0" y="0" width="1200" height="12" fill="#70374d"/>

  <g transform="translate(72 78)">
    <rect width="188" height="30" fill="#fff1e3" stroke="#70374d" stroke-opacity="0.3"/>
    <circle cx="17" cy="15" r="4" fill="#c06e7b"/>
    <text x="30" y="20" font-family="Menlo, monospace" font-size="12" letter-spacing="3" fill="#70374d">v3.0.0 RELEASE</text>
  </g>

  <text x="72" y="208" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="82" font-weight="700" letter-spacing="-4" fill="#70374d">Pack once.</text>
  <text x="72" y="292" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="82" font-weight="700" letter-spacing="-4" fill="#70374d">Ship Swift</text>
  <text x="72" y="376" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="82" font-weight="700" letter-spacing="-4" fill="#70374d">anywhere.</text>

  <path d="M74 392 H112 V382 H220 V396 H330 V378 H438 V392 H500" fill="none" stroke="#c06e7b" stroke-width="10"/>

  <text x="72" y="458" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="22" fill="#70374d" opacity="0.78">The Xcodeproj-less way to build and ship Swift apps.</text>
  <text x="72" y="490" font-family="Menlo, monospace" font-size="13" letter-spacing="2" fill="#9c4f5f">macOS · iOS · tvOS · visionOS · LINUX · WINDOWS · ANDROID</text>

  <g transform="translate(830 96) rotate(-4)">
    <rect x="8" y="8" width="300" height="380" fill="#c06e7b" opacity="0.45"/>
    <rect width="300" height="380" fill="#fff1e3" stroke="#70374d" stroke-width="3"/>
    <rect x="14" y="14" width="272" height="352" fill="none" stroke="#70374d" stroke-opacity="0.4" stroke-dasharray="5 6"/>
    <text x="30" y="44" font-family="Menlo, monospace" font-size="10" letter-spacing="2" fill="#9c4f5f">SWIFT BUNDLER / LOGISTICS</text>
    <text x="30" y="66" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="17" font-weight="600" fill="#70374d">Shipping label</text>

    <image href="logo.png" x="75" y="82" width="150" height="150"/>

    <text x="30" y="266" font-family="Menlo, monospace" font-size="9" letter-spacing="2" fill="#70374d" opacity="0.5">DESTINATION</text>
    <text x="30" y="284" font-family="Menlo, monospace" font-size="10" fill="#70374d">7 platforms · 7 bundlers</text>
    <text x="30" y="300" font-family="Menlo, monospace" font-size="10" fill="#70374d">1 TOML file</text>

    <rect x="30" y="318" width="180" height="34" fill="url(#bars)" opacity="0.85"/>
    <text x="30" y="368" font-family="Menlo, monospace" font-size="8" letter-spacing="3" fill="#70374d" opacity="0.55">3000 0000 0007</text>

    <g transform="translate(196 300) rotate(-7)">
      <rect width="86" height="52" fill="#fff1e3" stroke="#9c4f5f" stroke-width="2"/>
      <text x="43" y="20" text-anchor="middle" font-family="Menlo, monospace" font-size="7" letter-spacing="1" fill="#9c4f5f">CLEARED FOR</text>
      <text x="43" y="34" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="13" font-weight="700" fill="#9c4f5f">SHIPPING</text>
      <text x="43" y="45" text-anchor="middle" font-family="Menlo, monospace" font-size="6" letter-spacing="1" fill="#9c4f5f">SBUN-3.0.0</text>
    </g>
  </g>

  <rect x="0" y="600" width="1200" height="30" fill="#70374d"/>
  <text x="72" y="620" font-family="Menlo, monospace" font-size="10" letter-spacing="3" fill="#ffe2ca" opacity="0.65">SWIFTBUNDLER.DEV · MIT LICENSED · MADE IN SWIFT</text>
</svg>

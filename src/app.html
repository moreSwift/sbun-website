<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffe2ca" />
		<meta
			name="description"
			content="Swift Bundler turns Swift Package Manager executables into distributable
					apps and installers for seven platforms, with a single config file."
		/>
		<meta property="og:title" content="Swift Bundler — Ship Swift anywhere." />
		<meta
			property="og:description"
			content="The only way to build and ship Swift apps for every major platform."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://swiftbundler.dev/" />
		<meta property="og:site_name" content="Swift Bundler" />
		<meta property="og:image" content="https://swiftbundler.dev/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Swift Bundler — Ship Swift anywhere." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://swiftbundler.dev/og.png" />
		<meta name="twitter:image:alt" content="Swift Bundler — Ship Swift anywhere." />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffe2ca" />
		<meta
			name="description"
			content="Swift Bundler turns Swift Package Manager executables into signed, distributable apps for macOS, Linux, Windows, Android, iOS, tvOS and visionOS. One TOML file, no Xcode project."
		/>
		<meta property="og:title" content="Swift Bundler 3.0 — Ship Swift anywhere." />
		<meta
			property="og:description"
			content="The Xcodeproj-less way to build and ship Swift apps for seven platforms."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:image" content="/og.png" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
